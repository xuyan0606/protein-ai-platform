name: CI

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: pytest ────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests
        env:
          USE_SQLITE: "true"
        run: |
          python -m pytest tests/ -x -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Frontend: build ────────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

  # ── Agent integration: import check ────────────────────────────────────
  agent-imports:
    name: Agent Module Imports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements-core.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Verify agent module imports
        env:
          USE_SQLITE: "true"
        run: |
          python -c "
          from app.core.agent_schemas import Citation, EnzymeReference, PipelineExperience, SourceResult
          from app.core.data_agent import DataAgent, DataAgentResult
          from app.core.literature_agent import LiteratureAgent, LiteratureAgentResult
          from app.core.coordinator_agent import CoordinatorAgent, CoordinatorResult
          from app.core.agent_graph import AgentOrchestrator
          orch = AgentOrchestrator()
          assert orch._coordinator is not None
          assert orch._coordinator.cache_stats['size'] == 0
          print('✓ All agent modules imported and initialized successfully')
          "
