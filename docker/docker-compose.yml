version: "3.8"

# ---------------------------------------------------------------------------
# Protein AI Platform — Docker Compose
# ---------------------------------------------------------------------------
#   docker compose --env-file .env up -d
#
# Services communicate over the internal `app_network` bridge.  Hostnames
# match service names: postgres, redis, minio, chromadb, backend, etc.
# ---------------------------------------------------------------------------

services:
  # =========================================================================
  # Nginx — reverse proxy (entry point for all HTTP traffic)
  # =========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app_network
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # =========================================================================
  # Frontend — React SPA served by a lightweight Nginx inside the container
  # =========================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    expose:
      - "3000"
    networks:
      - app_network
    restart: unless-stopped
    # Dev-mode: mount source folder for hot-reload (comment out for prod)
    # volumes:
    #   - ../frontend/src:/app/src:ro

  # =========================================================================
  # Backend — FastAPI application server
  # =========================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    expose:
      - "8000"
    networks:
      - app_network
    env_file:
      - .env
    environment:
      # Infrastructure hostnames (override localhost defaults)
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      # Allow Docker-host browser origins
      CORS_ORIGINS: '["http://localhost:80","http://localhost:3000","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Dev-mode: mount app code for auto-reload (comment out for prod)
    # volumes:
    #   - ../backend/app:/app/app:ro

  # =========================================================================
  # Worker — Celery task runner (GPU / long-running protein computations)
  # =========================================================================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    networks:
      - app_network
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # GPU access (uncomment if needed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # =========================================================================
  # PostgreSQL 16 with pgvector extension
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-protein_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-protein_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # =========================================================================
  # Redis 7 — message broker (Celery) & cache
  # =========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # MinIO — S3-compatible object storage (file uploads / artifacts)
  # =========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # =========================================================================
  # ChromaDB — vector database (embeddings for semantic search / RAG)
  # =========================================================================
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# ===========================================================================
# Named volumes (persistent data that survives container recreation)
# ===========================================================================
volumes:
  pgdata:
  redis_data:
  minio_data:
  chroma_data:

# ===========================================================================
# Networks
# ===========================================================================
networks:
  app_network:
    driver: bridge
