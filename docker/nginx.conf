# =============================================================================
# Protein AI Platform — Main Nginx Reverse Proxy (HTTPS-enabled)
# =============================================================================
# Sits in front of all services.  Routes:
#   /      → frontend (React SPA)
#   /api/* → backend  (FastAPI)
#   /wiki  → outline  (knowledge base)
#
# Key features:
#   - HTTP → HTTPS redirect (port 80 → 443)
#   - SSE streaming support (proxy_buffering off on /api/)
#   - WebSocket upgrade passthrough
#   - Security headers (HSTS, X-Frame-Options, etc.)
#   - 100 MB upload limit
#   - Gzip compression
#
# SSL certificates:
#   Self-signed: docker/ssl/generate-certs.sh
#   Production:  Let's Encrypt (see generate-certs.sh output)
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------------
    # Performance tuning
    # -----------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Allow large file uploads (protein structures, FASTA files, etc.)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # -----------------------------------------------------------------------
    # SSL session settings
    # -----------------------------------------------------------------------
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -----------------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------------
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 64;
    }

    upstream outline_upstream {
        server outline:3001;
        keepalive 32;
    }

    # -----------------------------------------------------------------------
    # HTTP server — redirect all traffic to HTTPS
    # -----------------------------------------------------------------------
    server {
        listen       80;
        server_name  _;

        # Health-check endpoint (allow HTTP for Docker health checks)
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server
    # -----------------------------------------------------------------------
    server {
        listen       443 ssl;
        server_name  _;

        # SSL certificates (self-signed or Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ----- Security headers -------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # X-Frame-Options: allow Outline to embed (it uses iframes for collaboration)
        # but deny for other routes
        # Note: Outline's /wiki routes are handled separately below

        # ----- CORS headers (safety net; FastAPI also sets these) ----------
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'   '$http_origin' always;
            add_header 'Access-Control-Allow-Methods'  'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'  'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age'        1728000 always;
            add_header 'Content-Type'                  'text/plain; charset=utf-8' always;
            add_header 'Content-Length'                0 always;
            return 204;
        }

        add_header 'Access-Control-Allow-Origin'   '$http_origin' always;
        add_header 'Access-Control-Allow-Methods'  'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'  'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # ----- Frontend (React SPA) ----------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Connection upgrades (WebSocket)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # ----- API backend (FastAPI) ---------------------------------------
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket / SSE support — critical for streaming chat responses
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # *** SSE streaming ***
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;

            # Long timeout for SSE connections (24 h)
            proxy_read_timeout     86400s;
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
        }

        # ----- OIDC Discovery (Outline fetches this before redirecting user)
        location /.well-known/openid-configuration {
            proxy_pass http://backend_upstream/.well-known/openid-configuration;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Outline Wiki -------------------------------------------------
        location /wiki {
            # WebSocket upgrade for real-time collaboration
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://outline_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Disable buffering for SSE
            proxy_buffering        off;
            proxy_cache            off;

            # Outline needs iframe embedding for collaboration features
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # ----- Health-check endpoint ---------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
