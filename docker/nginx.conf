# =============================================================================
# Protein AI Platform — Main Nginx Reverse Proxy
# =============================================================================
# Sits in front of all services.  Routes:
#   /      → frontend (React SPA)
#   /api/* → backend  (FastAPI)
#
# Key features:
#   - SSE streaming support (proxy_buffering off on /api/)
#   - WebSocket upgrade passthrough
#   - CORS headers for cross-origin requests
#   - 100 MB upload limit
#   - Gzip compression
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------------
    # Performance tuning
    # -----------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Allow large file uploads (protein structures, FASTA files, etc.)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Upstream definitions
    # -----------------------------------------------------------------------
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 64;
    }

    # -----------------------------------------------------------------------
    # HTTP server
    # -----------------------------------------------------------------------
    server {
        listen       80;
        server_name  _;

        # ----- CORS headers (safety net; FastAPI also sets these) ----------
        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'   '$http_origin' always;
            add_header 'Access-Control-Allow-Methods'  'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers'  'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age'        1728000 always;
            add_header 'Content-Type'                  'text/plain; charset=utf-8' always;
            add_header 'Content-Length'                0 always;
            return 204;
        }

        # Add CORS headers to all responses
        add_header 'Access-Control-Allow-Origin'   '$http_origin' always;
        add_header 'Access-Control-Allow-Methods'  'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers'  'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # ----- Frontend (React SPA) ----------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Connection upgrades (WebSocket)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ----- API backend (FastAPI) ---------------------------------------
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # WebSocket / SSE support — critical for streaming chat responses
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # *** SSE streaming ***
            # Disable buffering so server-sent events arrive in real time.
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;

            # Long timeout for SSE connections (24 h)
            proxy_read_timeout     86400s;
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
        }

        # ----- Health-check endpoint ---------------------------------------
        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
