# =============================================================================
# Protein AI Platform — Main Nginx Reverse Proxy (HTTPS-enabled)
# =============================================================================
# Sits in front of all services.  Routes:
#   /      → frontend (React SPA)
#   /api/* → backend  (FastAPI)
#   /wiki/ → backend → outline  (knowledge base payload)
#
# Key features:
#   - HTTP → HTTPS redirect (port 80 → 443)
#   - SSE streaming support (proxy_buffering off on /api/)
#   - WebSocket upgrade passthrough
#   - Security headers (HSTS, X-Frame-Options, etc.)
#   - 100 MB upload limit
#   - Gzip compression
#
# SSL certificates:
#   Self-signed: docker/ssl/generate-certs.sh
#   Production:  Let's Encrypt (see generate-certs.sh output)
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # -----------------------------------------------------------------------
    # Performance tuning
    # -----------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    # Allow large file uploads (protein structures, FASTA files, etc.)
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # -----------------------------------------------------------------------
    # Gzip compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        image/svg+xml;

    # Re-resolve Docker service names after container recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Browser top-level navigation to Outline pages should enter the platform
    # SPA first so ProtectedRoute can redirect anonymous users cleanly. Embedded
    # iframe traffic, OIDC callbacks, static assets, realtime, and Outline API
    # calls keep using proxy routes.
    map "$http_sec_fetch_dest:$uri" $wiki_spa_document {
        default 0;
        "~^document:/wiki/(home|search)$" 1;
        "~^document:/wiki/(doc|collection)/" 1;
    }

    # -----------------------------------------------------------------------
    # SSL session settings
    # -----------------------------------------------------------------------
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # -----------------------------------------------------------------------
    # HTTP server — redirect all traffic to HTTPS
    # -----------------------------------------------------------------------
    server {
        listen       80;
        server_name  _;

        # Health-check endpoint (allow HTTP for Docker health checks)
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------------
    # Local plain-HTTP server for Codex port 4200
    # -----------------------------------------------------------------------
    # This server is exposed as host port 4200 -> container 8080.
    # Keep it stable so rebuilding the frontend container does not tear down
    # active /api SSE streams or auxiliary API requests from the browser.
    server {
        listen       8080;
        server_name  _;
        set $frontend_host   frontend:3000;
        set $backend_host    backend:8000;
        set $outline_host    outline:3001;
        # The container listens on 8080 but host port 80 is public. Forward
        # the public port so OIDC redirects never leak the internal listener.
        set $external_port   80;

        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Keep exact `/wiki` on the frontend SPA. Without this explicit route
        # nginx auto-redirects `/wiki` to `/wiki/` and leaks the container's
        # internal listener port (`:8080`) into the browser URL.
        location = /wiki {
            proxy_pass http://$frontend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Cookie            $http_cookie;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location = /home {
            set $home_host $frontend_host;
            set $home_uri /index.html;
            if ($http_sec_fetch_dest = iframe) { set $home_host $backend_host; }
            if ($http_sec_fetch_dest = iframe) { set $home_uri $request_uri; }

            proxy_pass http://$home_host$home_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Outline does not reliably support running its frontend router under
        # a /wiki sub-path. Keep the platform page at /wiki, but let embedded
        # Outline documents use their native root routes inside the iframe.
        location ~ ^/(doc|collection|search|settings|archive|drafts|trash|templates|share|s)(/|$) {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            gzip off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://$frontend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location /api/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Cookie            $http_cookie;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;

            proxy_read_timeout     86400s;
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
        }

        location /.well-known/openid-configuration {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /wiki/ {
            # Anonymous browser top-level navigation (for example `/wiki/home`)
            # must enter the platform SPA first so ProtectedRoute can redirect
            # cleanly to `/login?next=...`. Embedded iframe traffic and OIDC
            # callback hops keep flowing to the backend/Outline proxy.
            error_page 418 = @frontend_spa;
            if ($wiki_spa_document) { return 418; }

            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            gzip off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_cache off;
        }

        location @frontend_spa {
            proxy_pass http://$frontend_host/index.html;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location /auth/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realtime/ {
            proxy_pass http://$outline_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout          86400s;
            proxy_send_timeout          86400s;
        }

        location /static/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # -----------------------------------------------------------------------
    # HTTPS server
    # -----------------------------------------------------------------------
    server {
        listen       443 ssl;
        server_name  _;
        set $frontend_host   frontend:3000;
        set $backend_host    backend:8000;
        set $outline_host    outline:3001;
        set $external_port   443;

        # SSL certificates (self-signed or Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ----- Security headers -------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # X-Frame-Options: allow Outline to embed (it uses iframes for collaboration)
        # but deny for other routes
        # Note: Outline's /wiki routes are handled separately below

        # ----- CORS headers handled by FastAPI backend ---------------------
        # (nginx passes through backend CORS headers as-is)

        # ----- Frontend (React SPA) ----------------------------------------
        location = /wiki {
            proxy_pass http://$frontend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location = /home {
            set $home_host $frontend_host;
            set $home_uri /index.html;
            if ($http_sec_fetch_dest = iframe) { set $home_host $backend_host; }
            if ($http_sec_fetch_dest = iframe) { set $home_uri $request_uri; }

            proxy_pass http://$home_host$home_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # Outline does not reliably support running its frontend router under
        # a /wiki sub-path. Keep the platform page at /wiki, but let embedded
        # Outline documents use their native root routes inside the iframe.
        location ~ ^/(doc|collection|search|settings|archive|drafts|trash|templates|share|s)(/|$) {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            gzip off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://$frontend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            # Connection upgrades (WebSocket)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # ----- API backend (FastAPI) ---------------------------------------
        location /api/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header Cookie            $http_cookie;

            # WebSocket / SSE support — critical for streaming chat responses
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            # *** SSE streaming ***
            proxy_buffering        off;
            proxy_cache            off;
            chunked_transfer_encoding on;

            # Long timeout for SSE connections (24 h)
            proxy_read_timeout     86400s;
            proxy_connect_timeout  60s;
            proxy_send_timeout     60s;
        }

        # ----- OIDC Discovery (Outline fetches this before redirecting user)
        location /.well-known/openid-configuration {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Outline Wiki -------------------------------------------------
        # `/wiki` stays with the frontend SPA; `/wiki/*` is proxied through
        # the backend so cookie scope rewriting happens in one place.
        location /wiki/ {
            # Anonymous browser top-level navigation (for example `/wiki/home`)
            # must enter the platform SPA first so ProtectedRoute can redirect
            # cleanly to `/login?next=...`. Embedded iframe traffic and OIDC
            # callback hops keep flowing to the backend/Outline proxy.
            error_page 418 = @frontend_spa_tls;
            if ($wiki_spa_document) { return 418; }

            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            gzip off;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering off;
            proxy_cache off;
        }

        location @frontend_spa_tls {
            proxy_pass http://$frontend_host/index.html;
            proxy_http_version 1.1;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location /auth/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realtime/ {
            proxy_pass http://$outline_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Port  $external_port;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout          86400s;
            proxy_send_timeout          86400s;
        }

        location /static/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /fonts/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /images/ {
            proxy_pass http://$backend_host$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- Health-check endpoint ---------------------------------------
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
