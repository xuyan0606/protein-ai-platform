# =============================================================================
# Protein AI Platform — Frontend Nginx (inside the frontend container)
# =============================================================================
# Serves the React SPA static bundle.  All non-file routes fall back to
# index.html for client-side routing.  Static assets receive long-lived
# cache headers.
# =============================================================================

server {
    listen 3000;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for static files
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---- SPA fallback: all routes go to index.html ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static assets with long-term caching (fingerprinted by Vite) -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- API proxy (used when running frontend standalone w/o main nginx) -
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE support
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }
}
