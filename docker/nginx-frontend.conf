# =============================================================================
# Protein AI Platform — Frontend Nginx (inside the frontend container)
# =============================================================================
# Serves the React SPA static bundle.  All non-file routes fall back to
# index.html for client-side routing.  Static assets receive long-lived
# cache headers.
# =============================================================================

server {
    listen 3000;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for static files
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # ---- Dynamic DNS resolver (survives backend/outline restarts) ---------
    resolver 127.0.0.11 valid=5s;

    # Preserve upstream forwarded headers when this frontend is itself behind
    # another proxy/tunnel; otherwise fall back to the current request values.
    set $forwarded_host  $http_x_forwarded_host;
    set $forwarded_proto $http_x_forwarded_proto;
    set $forwarded_for   $http_x_forwarded_for;

    if ($forwarded_host = "") {
        set $forwarded_host $http_host;
    }
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }
    if ($forwarded_for = "") {
        set $forwarded_for $remote_addr;
    }

    # ---- SPA fallback: all routes go to index.html ------------------------
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Keep the exact `/wiki` route in the React SPA and avoid nginx's
    # automatic `/wiki/` redirect to the container's internal port 3000.
    # The embedded Outline iframe must use `/wiki/`, never exact `/wiki`,
    # otherwise it will recursively load the platform page inside itself.
    location = /wiki {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    location = /home {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files /index.html =404;
    }

    # Outline's frontend router expects native root routes such as /doc/... and
    # /collection/.... The platform keeps /wiki as the wrapper page, while the
    # embedded iframe uses these root routes through the backend proxy.
    location ~ ^/(doc|collection|search|settings|archive|drafts|trash|templates|share|s)(/|$) {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ---- Static assets with long-term caching (fingerprinted by Vite) -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- OIDC discovery (must reach backend, not SPA) ---------------------
    location /.well-known/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---- API proxy (backend FastAPI) ------------------------------------
    # Note: /api/auth.* routes are Outline's internal API — handled below.
    location /api/oidc {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location /realtime/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Outline auth API (must reach Outline, not backend) ---------------
    location /api/auth.info {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/auth.config {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/auth.me {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/events {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /api/pins {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/documents {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/collections {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/attachments {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        client_max_body_size 100M;
    }
    location /api/users {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
    location /api/fileOperations {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # ---- Outline static assets (JS/CSS/fonts for Wiki SPA) ----------------
    location /static/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_hide_header Content-Security-Policy;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 1y;
    }

    location /images/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        expires 1d;
    }

    # ---- Wiki (Outline) proxy --------------------------------------------
    # Keep exact `/wiki` for the platform page and reserve `/wiki/*`
    # for embedded Outline traffic. The trailing slash is significant.
    location /wiki/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_cookie_path /auth/ /;

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "base-uri 'none';default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self' 'unsafe-inline' 'unsafe-eval';media-src * data: blob:;img-src * data: blob:;frame-src * data:;worker-src 'self' blob:;object-src 'self';connect-src * ws: wss:;" always;
    }

    # ---- Outline auth routes (OIDC login/logout, SAML) -------------------
    location /auth/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
