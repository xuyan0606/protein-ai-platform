# =============================================================================
# Protein AI Platform — Frontend Nginx (inside the frontend container)
# =============================================================================
# Serves the React SPA static bundle.  All non-file routes fall back to
# index.html for client-side routing.  Static assets receive long-lived
# cache headers.
# =============================================================================

server {
    listen 3000;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip for static files
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/manifest+json;

    # ---- Dynamic DNS resolver (survives backend/outline restarts) ---------
    resolver 127.0.0.11 valid=5s;

    # ---- SPA fallback: all routes go to index.html ------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static assets with long-term caching (fingerprinted by Vite) -----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- OIDC discovery (must reach backend, not SPA) ---------------------
    location /.well-known/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API proxy --------------------------------------------------------
    location /api/ {
        set $backend http://backend:8000;
        rewrite ^/api/(.*) /api/$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ---- Outline static assets (JS/CSS/fonts for Wiki SPA) ----------------
    location /static/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Content-Security-Policy;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /fonts/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
    }

    location /images/ {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
    }

    # ---- Wiki (Outline) proxy --------------------------------------------
    location /wiki {
        set $outline http://outline:3001;
        proxy_pass $outline;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;

        # Fix CSP: allow scripts from /static/ path too
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "base-uri 'none';default-src 'self';style-src 'self' 'unsafe-inline';script-src http://localhost:4200 'unsafe-inline' 'unsafe-eval';media-src * data: blob:;img-src * data: blob:;frame-src * data:;worker-src 'self';object-src http://localhost:4200 'self' http://minio:9000;connect-src *" always;
    }
}
