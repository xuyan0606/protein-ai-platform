# =============================================================================
# Protein AI Platform — Dev Infrastructure (docker compose up -d for dev)
# =============================================================================
# Only brings up infrastructure services (DB, cache, storage, vector DB).
# The app services (backend, frontend, worker) run directly on the host for
# hot-reload development.
#
# Usage:
#   cd docker
#   docker compose -f docker-compose.dev.yml up -d          # start infra
#   docker compose -f docker-compose.dev.yml down -v        # stop + clean data
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL 16 with pgvector extension
  # ===========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-protein_ai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-protein_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Redis 7 — message broker (Celery) & cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ===========================================================================
  # MinIO — S3-compatible object storage
  # ===========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ===========================================================================
  # ChromaDB — vector database (embeddings / semantic search)
  # ===========================================================================
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data_dev:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  # Outline — team knowledge base (dev mode, backend runs on host)
  # ===========================================================================
  outline:
    image: outlinewiki/outline:latest
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379/1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_REGION: us-east-1
      AWS_S3_UPLOAD_BUCKET_NAME: outline-uploads
      AWS_S3_UPLOAD_BUCKET_URL: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: "true"
      AWS_S3_ACL: private
      OIDC_CLIENT_ID: protein-ai
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-oidc-secret-change-me-in-production}
      OIDC_AUTH_URI: http://localhost:8000/api/oidc/authorize
      OIDC_TOKEN_URI: http://host.docker.internal:8000/api/oidc/token
      OIDC_USERINFO_URI: http://host.docker.internal:8000/api/oidc/userinfo
      OIDC_LOGOUT_URI: http://localhost:8000/api/oidc/logout
      OIDC_DISPLAY_NAME: Protein AI
      OIDC_SCOPES: openid profile email
      SECRET_KEY: ${OUTLINE_SECRET_KEY:-a6a12c802c24de793c39eca2ac24060e0290637104d03cd53c66030a0454e0c8}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:-0fe2b485c0363633fc82c70d73b238fa7f134de46da36fe13f9a8d25ce7e96e3}
      URL: http://localhost:8000
      PORT: 3001
      FORCE_HTTPS: "false"
      FILE_STORAGE: s3
      RATE_LIMITER_ENABLED: "false"
    volumes:
      - outline_data_dev:/var/lib/outline/data
      - ./outline-passport-patched.js:/opt/outline/build/server/utils/passport.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_dev:
  redis_data_dev:
  minio_data_dev:
  chroma_data_dev:
  outline_data_dev:
