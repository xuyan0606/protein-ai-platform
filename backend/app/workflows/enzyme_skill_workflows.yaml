# Runtime-adapted subset of delivery package C6.
# Tool names here are limited to tools registered by this repository revision.
# Missing capabilities remain explicit in the workflow metadata and are never
# silently represented as executed steps.
schema_version: "1.0"
source: "交付包_最新完整版_20260906/C6_enzyme_skill_workflows_机器可读.yaml"
workflows:
  - skill_id: enzyme_specific_activity_runtime_v1
    objective: specific_activity
    triggers: ["比活力", "催化效率", "kcat", "specific activity", "catalytic efficiency"]
    missing_capabilities: [rosetta_ddg, validated_km_model]
    stages:
      - id: 0
        name: input_gate
        tools: [enzyme_input_gate]
        gates:
          - type: requires_sequence
            message: "比活力工作流需要氨基酸序列"
      - id: 1
        name: identity_and_baseline
        tools: [annotation_bundle, interproscan_sequence_submit, blast_search, catalytic_site_lookup, enzyme_identity_profile, enzyme_objective_module_plan, protein_benchmark, residue_numbering_gate, esmfold_folding, predict_properties]
        gates:
          - type: requires_sequence
            message: "身份与基线阶段需要氨基酸序列"
      - id: 2
        name: catalytic_efficiency_core
        tools: [mutation_scan, mutation_priority_score, enzyme_assistant_recommend, enzyme_assistant_build]
        gates:
          - type: requires_completed_stage
            stage_id: 1
            message: "身份与基线阶段未完成，禁止进入催化效率阶段"
      - id: 3
        name: delivery_evidence
        tools: []
        gates:
          - type: requires_completed_stage
            stage_id: 2
            message: "催化效率阶段未完成，禁止生成交付结论"

